<title>Fantasy du Conseil · CDS.TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap">
<style>
/* Plateau TV du Conseil : bandeau rouge, onglets, cartes à collectionner ; le tirage s'ouvre comme une caisse de CS:GO.
   Thème sombre unique, assumé : c'est l'identité de CDS.TV. Raretés des cartes = rang dans la tier list du Conseil. */
:root{
  --void:#08090b; --panel:#15171c; --panel2:#1d2027; --line:#2a2d35; --ink:#ffffff; --muted:#a7abb6; --dim:#6f7480;
  --red:#e4002b; --amber:#ffb400; --ok:#2fbf71; --bad:#ff4d6a;
  --r-goat:#ff7a1a; --r-leg:#ffb400; --r-epic:#b14cff; --r-rare:#4b8bff; --r-com:#8a93a6;
  --display:"Anton","Impact","Arial Narrow",sans-serif; --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font:17px/1.4 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}
.band{background:var(--red);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:7px max(16px,env(safe-area-inset-left,0px));font:700 .88rem var(--body);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:18px}
.eyebrow{font:700 .78rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h1{font:400 clamp(2.4rem,7vw,4rem)/.92 var(--display);text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
h1 b{color:var(--red);font-weight:400}
h2{font:400 1.6rem var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
h3{font:400 1.2rem var(--display);text-transform:uppercase;margin:0;color:var(--amber);letter-spacing:.02em}
.lead{margin:6px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--panel);border-top:3px solid var(--red);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.note{color:var(--muted);font-size:.92rem}
.btn{border:0;background:var(--red);color:#fff;font:700 .9rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
.btn:hover{background:#ff1744}.btn.ghost{background:transparent;border:2px solid var(--amber);color:var(--amber)}.btn.ghost:hover{background:var(--amber);color:var(--void)}
.btn.gold{background:var(--amber);color:var(--void)}.btn.small{padding:6px 10px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select,input[type=datetime-local]{padding:9px 10px;background:var(--void);border:1px solid var(--line);color:#fff;font:600 1.02rem var(--body)}
.state{padding:12px 16px;background:var(--panel2);border-left:6px solid var(--amber);font-weight:600}
.state.red{border-left-color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line)}

/* onglets */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;padding:12px 14px;font:400 1.1rem var(--display);text-transform:uppercase;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font:700 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--void)}
.chip:hover{border-color:var(--amber)}

/* cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{--rc:var(--r-com);position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,#0b0c0f) 0%,#121318 55%,#0d0e11 100%);border:1px solid color-mix(in srgb,var(--tc) 40%,#2a2d35);border-bottom:4px solid var(--rc);overflow:hidden;min-width:0;text-decoration:none;color:#fff}
a.card{transition:transform .15s ease}a.card:hover{transform:translateY(-3px)}
.card.goat{background:linear-gradient(180deg,#5c4300 0%,#2a2000 45%,#120e00 100%);border-color:#ffb400}
.card.taken{filter:grayscale(1) brightness(.45)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 10px 0;position:relative;z-index:2}
.rank{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.rank b{font:400 1.9rem var(--display);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.rank span{font:700 .64rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.logo{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.logo.light{background:#e9ecef;border-radius:50%;padding:4px}
.photo{height:160px;margin-top:-32px;display:flex;align-items:flex-end;justify-content:center}
.photo img{height:100%;width:100%;object-fit:cover;object-position:center top;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.card .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:5px;position:relative;z-index:2;margin-top:-16px}
.name{font:400 1.5rem/1 var(--display);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font:600 .82rem var(--body);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font:400 1.1rem var(--display);font-variant-numeric:tabular-nums}
.stats span{font:700 .6rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.owner{font:700 .78rem var(--body);color:var(--amber);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.1em}
.cap{position:absolute;right:8px;top:54px;z-index:3;background:var(--amber);color:var(--void);font:800 .7rem var(--body);letter-spacing:.08em;padding:2px 6px}

/* équipe d'un sage */
.squad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.squad{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .lane{font:700 .74rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.slot .capbtn{align-self:stretch}

/* tirage */
.caisse{background:radial-gradient(ellipse at center,#1d2027 0%,#0b0c0f 75%);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;overflow:hidden}
.caisse .who{font:400 clamp(1.4rem,4vw,2.2rem) var(--display);text-transform:uppercase;text-align:center}
.caisse .who b{color:var(--amber);font-weight:400}
.reel{position:relative;width:100%;height:178px;overflow:hidden;background:#06070a;border-block:2px solid var(--line)}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:3;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#06070a,transparent)}.reel::after{right:0;background:linear-gradient(270deg,#06070a,transparent)}
.marker{position:absolute;left:50%;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--amber);z-index:4;box-shadow:0 0 12px var(--amber)}
.strip{position:absolute;top:8px;left:0;display:flex;gap:8px;will-change:transform}
.it{--rc:var(--r-com);width:132px;height:158px;flex:none;position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 50%,#0b0c0f),#101116 70%);border-bottom:5px solid var(--rc)}
.it img.ph{position:absolute;inset:0 0 26px 0;width:100%;height:calc(100% - 26px);object-fit:cover;object-position:top}
.it .lg{position:absolute;top:5px;right:5px;width:26px;height:26px;object-fit:contain}
.it span{position:absolute;left:0;right:0;bottom:0;height:26px;display:grid;place-items:center;background:rgba(0,0,0,.65);font:400 .95rem var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.reveal{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.reveal .card{width:200px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.glow{box-shadow:0 0 40px color-mix(in srgb,var(--rc) 70%,transparent)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rar{font:800 .82rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.drawtbl td,.drawtbl th{white-space:nowrap}
.drawtbl td.new{background:color-mix(in srgb,var(--amber) 18%,transparent)}
.progress{height:6px;background:var(--void);width:100%}.progress i{display:block;height:100%;background:var(--amber)}

/* tableaux */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font:700 .76rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{color:var(--amber)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.mini{display:flex;align-items:center;gap:8px;min-width:0}
.mini img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel2);flex:none}
.mini img.tlg{width:22px;height:22px;border-radius:0;object-fit:contain;background:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.mini img.tlg.light{background:#e8e8e8;border-radius:4px;padding:2px}
.pts td,.pts th{vertical-align:top}.pts td:first-child{font-weight:700;white-space:nowrap}
.det summary{cursor:pointer;list-style:none}.det summary::-webkit-details-marker{display:none}.det summary b{border-bottom:1px dashed var(--dim)}
.det ul{list-style:none;padding:6px 0 0;margin:0;min-width:240px;text-align:left}.det li{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.hero{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .card{max-width:240px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--void);padding:10px 12px;display:flex;flex-direction:column}
.kv b{font:400 1.6rem var(--display);font-variant-numeric:tabular-nums}.kv span{font:700 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* votes */
.game{background:var(--void);padding:14px;display:flex;flex-direction:column;gap:10px}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.vote-grid button{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.vote-grid button img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;flex:none}
.vote-grid button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.vote-grid button[aria-pressed="true"].mvp{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel))}
.vote-grid button[aria-pressed="true"].kk{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--panel))}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.rules div{background:var(--void);padding:12px 14px}
.rules ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}.rules li b{color:#fff}
[data-view]{display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion:reduce){a.card{transition:none}.reveal .card{animation:none}}
.stage{width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.stage .after{width:100%;display:flex;justify-content:center}
.it.win{outline:3px solid var(--amber);outline-offset:-3px;box-shadow:0 0 30px var(--amber)}
.teampop{position:fixed;inset:0;z-index:60;background:rgba(4,5,7,.88);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.tp-in{background:var(--panel);border-top:4px solid var(--amber);padding:20px;max-width:1100px;width:100%;display:flex;flex-direction:column;gap:14px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.tp-in h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--panel2);border-left:6px solid var(--amber);padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.band{margin-top:0}
.testbar{background:var(--panel2);border-left:6px solid var(--amber);padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.locked-list{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>

const logo=(code,cls="logo")=>{const t=DATA.teams[code];return t.logo?`<img class="${cls}${t.light?" light":""}" src="${t.logo}" alt="${esc(t.n)}" loading="lazy">`:esc(code)};

// ---------- points ----------
const fr=x=>String(Math.round(x*10)/10).replace(".",",");
const pl=(n,one,many)=>`${n} ${n>1?many:one}`;
function detail(st,role,g){const R=ROLE_PTS[role]||ROLE_PTS.Mid,o=[],add=(l,v)=>{if(v)o.push([l,v])};
  if(st.win)add("Victoire",PTS.win);
  add(pl(st.k||0,"kill","kills"),(st.k||0)*R.k);add(pl(st.a||0,"assist","assists"),(st.a||0)*R.a);add(pl(st.d||0,"mort","morts"),(st.d||0)*PTS.d);
  if(st.d===0)add("Aucune mort",PTS.clean);
  if(st.solo)add(pl(st.solo,"solokill","solokills"),st.solo*PTS.solo);
  if(st.fb)add("Premier sang",PTS.fb);
  if(st.triple)add(pl(st.triple,"triple kill","triple kills"),st.triple*PTS.triple);
  if(st.quadra)add(pl(st.quadra,"quadra kill","quadra kills"),st.quadra*PTS.quadra);
  if(st.penta)add(pl(st.penta,"pentakill","pentakills"),st.penta*PTS.penta);
  if(R.cs&&st.cs)add(`${st.cs} CS`,Math.floor(st.cs/R.cs));
  if(R.dmg&&st.dmg>=R.dmg[0])add(`${Math.round(st.dmg*100)} % des dégâts de l'équipe`,R.dmg[1]);
  if(R.kp&&st.kp>=R.kp[0])add(`${Math.round(st.kp*100)} % de participation aux kills`,R.kp[1]);
  const ob=g?.obj?.[st.team];
  if(R.drag&&ob?.drag)add(pl(ob.drag,"dragon de l'équipe","dragons de l'équipe"),ob.drag*R.drag);
  if(R.baron&&ob?.baron)add(pl(ob.baron,"Baron de l'équipe","Barons de l'équipe"),ob.baron*R.baron);
  if(R.wp&&st.wp)add(`${st.wp} balises posées`,Math.floor(st.wp/R.wp));
  if(R.wk&&st.wk)add(`${st.wk} balises détruites`,Math.floor(st.wk/R.wk));
  return o}
function base(st,role,g){return detail(st,role,g).reduce((t,x)=>t+x[1],0)}
function voteDeadline(g){const day=parisDay(g.at);const next=games.filter(x=>parisDay(x.at)>day).sort((a,b)=>a.at-b.at)[0];return next?next.at:g.at+36*3600e3}
// MVP : le choix officiel (Player of the Game relevé sur Leaguepedia), posé dans la partie par le robot (g.mvp). Plus de vote.
function voteResult(g){return {mvp:g.mvp?[g.mvp]:[]}}
const VR={};function vr(g){return VR[g.id]||(VR[g.id]=voteResult(g))}
function gamePts(g,name){const st=g.players?.[name];if(!st)return null;const r=vr(g);let s=base(st,P[name]?.role,g);if(r.mvp.includes(name))s+=PTS.mvp;return Math.round(s*10)/10}
function gameDetail(g,name){const st=g.players[name],r=vr(g),o=detail(st,P[name]?.role,g);if(r.mvp.includes(name))o.push(["MVP officiel de la game",PTS.mvp]);return o}
function playerPts(name,phase){let t=0,n=0;for(const g of games){if(phase&&g.phase!==phase)continue;const s=gamePts(g,name);if(s!=null){t+=s;n++}}return {t,n}}
function teamOf(id,phase){const d=phases[phase];if(!d?.picks)return null;const o={};for(const x of d.picks)if(x.uid===id)o[x.role]=x.name;return o}
function sagePts(id,phase){let t=0;for(const ph of phase?[phase]:PHASES.map(p=>p.id)){const tm=teamOf(id,ph);if(!tm)continue;const cap=captains[id]?.[ph];
  for(const r of ROLES){const n=tm[r];if(!n)continue;const pt=playerPts(n,ph).t;t+=n===cap?pt*PTS.captain:pt}}return Math.round(t*10)/10}
function ownersOf(name,phase){const d=phases[phase];if(!d?.picks)return[];return d.picks.filter(x=>x.name===name).map(x=>x.uid)}
const currentPhase=()=>{const drawn=PHASES.filter(p=>phases[p.id]?.picks);return drawn.length?drawn[drawn.length-1].id:"swiss"};
const sageName=id=>id==="demo"?"l'essai":sages[id]?.pseudo||names[id]?.name||"Un sage";

// ---------- cartes ----------
function card(p,o={}){const t=team(p),r=rarity(p),goat=p.rank===0,pts=o.pts!=null?o.pts:playerPts(p.name).t;
  const tag=o.href?"a":"div";
  return `<${tag} class="card${goat?" goat":""}${o.taken?" taken":""}${o.glow?" glow":""}" ${o.href?`href="${o.href}"`:""} style="--tc:${t.c};--rc:${r.c}">

    ${o.cap?`<span class="cap">CAPITAINE ×2</span>`:""}

      ${o.owner!==undefined?`<div class="owner">${o.owner}</div>`:""}
      <div class="stats"><div><b>${p.avg==null?"–":p.avg.toFixed(1).replace(".",",")}</b><span>note /5</span></div><div><b>${playerPts(p.name).n}</b><span>parties</span></div><div><b>${fr(pts)}</b><span>points</span></div></div>

function teamReveal(){if(!uid||busy)return;for(const ph of PHASES){const d=phases[ph.id];if(!d||!d.picks||d.picks.length<totalSteps(d)||!d.order.includes(uid))continue;

function teamPanel(id,ph,mine){const tm=teamOf(id,ph),cap=captains[id]?.[ph],locked=Date.now()>=phaseStart(ph),label=PHASES.find(p=>p.id===ph).label;

        ${mine?`<button class="btn small ${cap===n?"gold":"ghost"} capbtn" data-cap="${esc(n)}" data-ph="${ph}" ${locked?"disabled":""}>${cap===n?"Capitaine":"Choisir capitaine"}</button>`:""}</div>`}).join("")}</div>
    ${mine&&!cap&&!locked?`<div class="state">Choisis ton capitaine : il marque double pendant toute la ${label.toLowerCase()}.</div>`:""}</section>`}

let tPhase=null,busy=false,room=null,style="csgo";
const stepInfo=(d,i)=>({role:ROLES[Math.floor(i/d.order.length)],uid:d.order[i%d.order.length]});
const totalSteps=d=>d.order.length*ROLES.length;
function poolFor(ph,role){const d=phases[ph],teams=d.teams||Object.keys(DATA.teams);
  let pool=DATA.players[role].filter(p=>teams.includes(p.team)).map(p=>p.name);
  if(PHASES.find(p=>p.id===ph).unique){const used=new Set(d.picks.filter(y=>y.role===role).map(y=>y.name));const left=pool.filter(n=>!used.has(n));if(left.length)pool=left}
  else{const used=new Set(d.picks.filter(y=>y.role===role).map(y=>y.name));const left=pool.filter(n=>!used.has(n));if(left.length)pool=left}
  return pool}

function vTirage(v){

  h+=`<section class="panel"><h2>Résultat en direct</h2><div class="tw"><table class="drawtbl"><thead><tr><th>Sage</th>${ROLES.map(r=>`<th>${r}</th>`).join("")}</tr></thead><tbody>${d.order.map(id=>`<tr class="${id===uid?"me":""}"><td><a href="#sage-${encodeURIComponent(id)}">${esc(sageName(id))}</a></td>${ROLES.map(r=>{const x=d.picks.find(y=>y.uid===id&&y.role===r),isLast=x&&x===last;

function revealHTML(x){const p=P[x.name],r=rarity(p);

function ownerStart(ph){const def=new Date(phaseStart(ph.id)),loc=new Date(def.getTime()-def.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  return `<div class="state red">Tu es l'organisateur. Quand tout le monde est inscrit, prépare le tirage : l'ordre des sages est tiré au sort, puis tu ouvres les caisses une par une en direct.</div>

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

}
async function prepare(){const ph=PHASES.find(p=>p.id===tPhase);const teams=ph.unique?Object.keys(DATA.teams):[...document.querySelectorAll(".dTeam:checked")].map(x=>x.value);

  catch(e){$("drawMsg").textContent="Échec : réessaie.";$("prep").disabled=false}}

// --- ouverture réelle (compte de Skryvv) ---
async function openBox(){if(busy)return;const ph=tPhase,d=phases[ph];const n=d.picks.length;if(n>=totalSteps(d))return;
  const st=stepInfo(d,n),pool=poolFor(ph,st.role),name=pool[rnd(pool.length)],seq=reelSeq(pool,name),pick={uid:st.uid,role:st.role,name,at:Date.now()};

let audio=null;function tick(f=1400,len=.05,vol=.04){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+len);o.stop(audio.currentTime+len+.01)}catch(e){}}
// Son de révélation selon la rareté : Commun une note, Rare deux, Épique un arpège, Légendaire une fanfare, Faker une entrée à part
function note(f,at,len,type="triangle",vol=.08){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len+.05)}catch(e){}}
function rankSound(p){if(!p)return;const r=p.rank;
  if(r===0){note(65,0,1.4,"sine",.25);note(98,0,1.4,"sine",.12);[392,523,659,784,1047].forEach((f,i)=>note(f,.25+i*.11,.5,"sawtooth",.04));[523,659,784,1047].forEach(f=>note(f,.85,1.8,"triangle",.07));note(1568,.85,1.8,"sine",.03);return}
  if(r<=3){[523,659,784].forEach((f,i)=>note(f,i*.12,.35,"square",.04));[523,659,784,1047].forEach(f=>note(f,.4,1.2,"triangle",.07));return}
  if(r<=7){[440,554,659,880].forEach((f,i)=>note(f,i*.09,.45,"triangle",.08));return}
  if(r<=11){note(523,0,.3);note(784,.13,.45);return}
  note(392,0,.35,"sine",.1)}

  const reel=box.querySelector(".reel"),s=box.querySelector(".strip"),W=140,rw=reel.clientWidth;
  s.style.transform=`translateX(${-(4*W)+rw/2-W/2}px)`;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,dur=reduce?0:5600,target=-(40*W)+rw/2-W/2+(Math.random()-.5)*W*.6;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transition=`transform ${dur}ms cubic-bezier(.08,.6,.12,1)`;s.style.transform=`translateX(${target}px)`;
    let last=null;const t0=performance.now();(function loop(){const m=new DOMMatrix(getComputedStyle(s).transform).m41,idx=Math.floor((rw/2-m)/W);if(idx!==last){last=idx;tick()}if(performance.now()-t0<dur)requestAnimationFrame(loop)})();

    try{await db.doc("sages/"+uid).set({pseudo:p,at:Date.now()})}catch(err){$("joinMsg").textContent="Inscription impossible : recharge la page et réessaie."}};
  const l=$("leave");if(l)l.onclick=()=>{if(!l.dataset.sure){l.dataset.sure=1;l.textContent="Confirmer la désinscription";return}db.doc("sages/"+uid).delete().catch(()=>{})};
};
function ownerBar(){const v=$("view"),b=document.createElement("div");b.className="testbar";
  b.innerHTML=isPublic?`<span><b>Fantasy visible par tous.</b> Les sages voient le tirage, le classement et les votes.</span><button class="btn ghost small" id="pubOff">Repasser en mode test</button>`
    :`<span><b>Mode test.</b> Toi seul vois toute la fantasy ; les autres sages ne voient que les inscriptions.</span><button class="btn small" id="pubOn">Rendre visible à tous</button>`;
  v.prepend(b);
  const on=$("pubOn"),off=$("pubOff"),setPub=x=>fdb.collection("fantasy").doc("config").set({public:x,at:Date.now()},{merge:true});
  if(on)on.onclick=()=>{if(!on.dataset.sure){on.dataset.sure=1;on.textContent="Confirmer : tout rendre visible";return}setPub(true)};
  if(off)off.onclick=()=>setPub(false)}

let fdb=null;
(async()=>{
  conseilNav("fantasy");
  render();
  const c=await conseilConnect();
  if(!c.db){render();return}
  fdb=c.db;db=fsDb(fdb);uid=c.uid;isOwner=uid===FANTASY_ADMIN;
  fdb.collection("riot").doc(uid).get().then(s=>{myProfile=s.data()||null;if(!busy)render()}).catch(()=>{});
  const sub=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s);if(!busy)render()},e=>console.error(e));
  sub("sages",s=>{sages={};s.docs.forEach(d=>sages[d.id]=d.data())});
  sub("phases",s=>{phases={};s.docs.forEach(d=>phases[d.id]=d.data())});
  sub("captains",s=>{captains={};s.docs.forEach(d=>captains[d.id]=d.data())});
  sub("votes",s=>{votes={};s.docs.forEach(d=>votes[d.id]=d.data())});
  sub("games",s=>{games=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at)});
})();
</script>
