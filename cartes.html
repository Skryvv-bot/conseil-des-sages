<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartes de Runeterra · CDS.TV</title>
<meta name="theme-color" content="#08090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700;800&family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="conseil.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
/* Cartes de Runeterra : boosters (ouverture façon Pokémon), collection, vitrines des sages, wiki du jeu.
   Le robot CDS.TV tire les cartes et tient les comptes ; la page ne fait qu'afficher. */
:root{--r0:#8a96a3;--r1:#3fbf7f;--r2:#2f8cff;--r3:#b45cff;--r4:#ffb400;--red:#e4002b;--amber:#ffb400}
.wrap{max-width:1120px}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid #2a2d35}
.ctabs a{text-decoration:none;color:var(--muted);font:700 .82rem var(--body);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px}
.ctabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--red)}
.ctabs a:hover{color:#fff}
.purse{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:700 .95rem var(--body);letter-spacing:.04em;color:var(--muted)}
.purse b{color:#fff;font:400 1.35rem var(--display,"Anton"),sans-serif;letter-spacing:.02em}
.purse .po b{color:var(--amber)}
.prog{width:140px;height:6px;background:#2a2d35}.prog i{display:block;height:100%;background:var(--red)}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---- Cartes (5:7) ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.tc{--rc:var(--r0);position:relative;aspect-ratio:5/7;width:100%;background:#0b1520;border:2px solid var(--rc);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;color:#fff;text-align:left;padding:0;font:inherit;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
button.tc:hover{transform:translateY(-3px)}
.tc-art{position:absolute;inset:0;background-size:cover;background-position:center 18%}
.tc-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,10,19,0) 38%,rgba(1,10,19,.92) 72%,#010a13)}
.tc-gem{position:absolute;top:8px;left:8px;width:14px;height:14px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 10px var(--rc);border:1px solid rgba(255,255,255,.5)}
.tc-no{position:absolute;top:6px;right:8px;font:700 .7rem var(--body);color:rgba(255,255,255,.8);letter-spacing:.06em;text-shadow:0 1px 3px #000}
.tc-icon{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background-repeat:no-repeat;border:2px solid var(--rc);border-radius:6px;box-shadow:0 0 24px rgba(0,0,0,.8)}
.tc-key{position:absolute;left:50%;top:7%;transform:translateX(-50%);font:400 1.2rem var(--display,"Anton"),sans-serif;color:var(--rc);text-shadow:0 1px 4px #000}
.tc-body{position:relative;margin-top:auto;padding:0 10px 9px;display:flex;flex-direction:column;gap:2px}
.tc-nm{font:400 1.05rem/1.1 var(--display,"Anton"),sans-serif;text-transform:uppercase;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sub{font:600 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-st{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;font:700 .78rem var(--body);color:#fff;border-top:1px solid rgba(255,255,255,.18);padding-top:4px;margin-top:3px}
.tc-st b{color:var(--rc)}
.tc-cnt{position:absolute;top:28px;right:6px;background:rgba(1,10,19,.85);border:1px solid #3a3e48;font:700 .72rem var(--body);padding:1px 6px;color:#fff}
.tc-flags{display:flex;gap:4px;margin-bottom:3px}.tc-flags:empty{display:none}
.tc-new{background:var(--red);font:700 .7rem var(--body);letter-spacing:.1em;padding:1px 6px;color:#fff}
.tc-vit{background:var(--amber);color:#08090b;font:700 .66rem var(--body);letter-spacing:.08em;padding:1px 5px;text-transform:uppercase}
.tc.miss{border-color:#26303d;filter:grayscale(1) brightness(.5)}
button.tc.miss:hover{filter:grayscale(.6) brightness(.6)}
.tc.region .tc-art{background-position:center}
.tc.big{width:min(290px,78vw);cursor:default;flex:none}
.tc.big .tc-nm{font-size:1.55rem}.tc.big .tc-sub{font-size:.85rem}.tc.big .tc-st{font-size:.95rem}
.tc.glow{box-shadow:0 0 34px var(--rc)}
.tc.holo::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:color-dodge;opacity:.45;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 35%,rgba(255,180,0,.35) 42%,rgba(180,92,255,.35) 50%,transparent 62%);background-size:250% 100%;animation:holo 3.2s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.rar{font:700 .78rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}

/* ---- Boutique de boosters ---- */
.shopc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.prod{background:#15171c;border-top:3px solid var(--pc,#3a3e48);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.prod h3{margin:0;font:400 1.35rem var(--display,"Anton"),sans-serif;text-transform:uppercase;color:#fff!important;letter-spacing:.02em!important}
.prod p{margin:0;color:var(--muted);font-size:.95rem}
.prod .price{font:700 1.05rem var(--body);color:var(--amber);letter-spacing:.04em}
.prod select{width:100%;padding:9px;background:#08090b;border:1px solid #2a2d35;color:#fff}
.prod .btn{margin-top:auto}
.prod .mini{align-self:center}
.rates{width:100%;border-collapse:collapse;font-size:.95rem}.rates td,.rates th{padding:7px 8px;border-bottom:1px solid #2a2d35;text-align:left}.rates th{font:700 .74rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.rates .num,.num{text-align:right;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:6px}
.feed div{display:flex;gap:10px;align-items:center;background:#08090b;padding:8px 10px;font-size:.95rem}
.feed .d{margin-left:auto;color:#6f7480;font-size:.8rem;white-space:nowrap}

/* ---- Booster (l'objet) ---- */
.pack{--pw:200px;--ph:320px;--p1:#e4002b;--p2:#5c0012;position:relative;width:var(--pw);height:var(--ph);flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
.pack .pk-top,.pack .pk-body{position:absolute;left:0;right:0;background:linear-gradient(160deg,var(--p1),var(--p2) 70%,#08090b);background-size:var(--pw) var(--ph);overflow:hidden}
.pack .pk-top{top:0;height:44px;border-radius:6px 6px 0 0;background-position:0 0;cursor:grab;z-index:3;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .55s}
.pack .pk-body{top:44px;bottom:0;border-radius:0 0 6px 6px;background-position:0 -44px;z-index:2;transition:transform .6s ease-in,opacity .6s}
.pack .pk-top::before,.pack .pk-body::after{content:"";position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,rgba(255,255,255,.08) 3px 6px)}
.pack .pk-top::before{top:0}.pack .pk-body::after{bottom:0}
.pack .pk-cut{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--tear,0)*100%);background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--amber)}
.pack .pk-dash{position:absolute;left:6px;right:6px;bottom:1px;border-top:2px dashed rgba(255,255,255,.45)}
.pack .pk-win{position:absolute;left:12px;right:12px;top:24px;height:58%;background-size:cover;background-position:center 20%;border:2px solid rgba(255,255,255,.65);box-shadow:0 0 0 4px rgba(0,0,0,.25)}
.pack .pk-lbl{position:absolute;left:12px;right:12px;bottom:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;color:#fff}
.pack .pk-lbl b{font:400 1.55rem/1 var(--display,"Anton"),sans-serif;letter-spacing:.06em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.pack .pk-lbl span{font:700 .72rem var(--body);letter-spacing:.24em;text-transform:uppercase;opacity:.9}
.pack .pk-shine{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:6px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:300% 100%;animation:shine 2.8s ease-in-out infinite;mix-blend-mode:overlay}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-130% 0}}
.pack.torn .pk-top{transform:translate(70px,-160px) rotate(28deg);opacity:0;pointer-events:none}
.pack.drop .pk-body{transform:translateY(120vh) rotate(-6deg);opacity:.2}
.pack.drop .pk-shine{display:none}
.pack.idle{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.pack.mini{--pw:120px;--ph:192px}.pack.mini .pk-top{height:28px}.pack.mini .pk-body{top:28px;background-position:0 -28px}.pack.mini .pk-win{top:16px;left:8px;right:8px;height:50%}.pack.mini .pk-lbl b{font-size:1rem}.pack.mini .pk-lbl span{font-size:.56rem}.pack.mini .pk-lbl{bottom:16px}
.pack[data-k="free"]{--p1:#3a3e48;--p2:#15171c}.pack[data-k="std"]{--p1:#e4002b;--p2:#5c0012}.pack[data-k="region"]{--p1:#1f7a5a;--p2:#0c2a22}.pack[data-k="chest"]{--p1:#ffb400;--p2:#6a3d00}
.pack[data-k="region"] .pk-win{background-position:center}.pack[data-k="chest"] .pk-win{background-size:92% auto;background-repeat:no-repeat;background-position:center;background-color:#06223a;box-shadow:inset 0 0 30px rgba(10,200,255,.45),0 0 0 4px rgba(0,0,0,.25)}

/* ---- Scène d'ouverture ---- */
.stage{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#1d2027,#08090b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:hidden}
.stage .hint{font:700 .9rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;min-height:1.4em}
.stage .tools{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px}
.stage .tools button{background:rgba(0,0,0,.4);border:1px solid #3a3e48;color:#fff;min-width:44px;min-height:44px;cursor:pointer;font:700 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:0 12px}
.arena{position:relative;width:260px;height:370px;display:grid;place-items:center}
.arena>.pack{position:absolute}
.ocard{position:absolute;width:min(250px,64vw);aspect-ratio:5/7;perspective:1000px;background:none;border:0;padding:0;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
.ocard .in{display:block;position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.ocard.on .in{transform:rotateY(180deg)}
.ocard .face{display:block;position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ocard .face.front{transform:rotateY(180deg)}
.ocard .face.front .tc{height:100%}
.ocard.hidden{opacity:0;transform:translateY(60px) scale(.9);pointer-events:none}
.ocard.gone{opacity:0;transform:translate(-140%,40px) rotate(-14deg);pointer-events:none}
.cback{display:grid;place-items:center;width:100%;height:100%;border-radius:10px;border:2px solid #3a3e48;
  background:radial-gradient(circle at 50% 45%,rgba(228,0,43,.35),transparent 45%),repeating-linear-gradient(45deg,#101318 0 10px,#15171c 10px 20px)}
.cback i{width:34%;aspect-ratio:1;transform:rotate(45deg);border:3px solid var(--red);box-shadow:0 0 18px rgba(228,0,43,.6)}
.cback em{position:absolute;bottom:14px;font:400 1rem var(--display,"Anton"),sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.5);font-style:normal}
.ocard.tease .cback{border-color:var(--rc);box-shadow:0 0 30px var(--rc),0 0 60px var(--rc)}
.ocard.tease .cback i{border-color:var(--rc);box-shadow:0 0 22px var(--rc)}
.ocard.tease{animation:tease .9s ease-in-out infinite}
@keyframes tease{25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px}
.strip .s{width:44px;aspect-ratio:5/7;border:2px solid var(--rc);border-radius:5px;background-size:cover;background-position:center 18%;animation:pop .3s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;background:radial-gradient(circle,var(--rc),transparent 70%);animation:flash .9s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.spark{position:fixed;z-index:91;width:8px;height:8px;border-radius:50%;background:var(--rc);pointer-events:none;box-shadow:0 0 10px var(--rc)}
.recap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:min(1000px,100%)}
@media (max-width:760px){.recap{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.recap{grid-template-columns:repeat(2,minmax(0,1fr))}.arena{transform:scale(.9)}}
.stage .recap-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-height:100%;overflow-y:auto;padding:8px 0}
.stage h2{margin:0}

/* ---- Wiki ---- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wtile{position:relative;aspect-ratio:3/4;border:1px solid #2a2d35;overflow:hidden;text-decoration:none;color:#fff;background-size:cover;background-position:center 15%;background-color:#15171c}
.wtile span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(180deg,transparent,rgba(8,9,11,.95));font:400 1rem var(--display,"Anton"),sans-serif;text-transform:uppercase}
.wtile:hover{border-color:var(--amber)}
.champ-hero{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:680px){.champ-hero{grid-template-columns:1fr}.champ-hero>img{max-width:220px}}
.champ-hero>img{width:100%;border:2px solid #3a3e48}
.lore{white-space:pre-line;max-width:70ch;color:#d8d8dc}
.abil{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid #2a2d35}
.abil .ic{width:56px;height:56px;border:1px solid #3a3e48;background-repeat:no-repeat}
.abil b{font:400 1.05rem var(--display,"Anton"),sans-serif;text-transform:uppercase;color:#fff}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:#08090b;border:1px solid #2a2d35;padding:8px 10px}.kv span{display:block;font:700 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.kv b{font-variant-numeric:tabular-nums}
.cbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cbars span{font:700 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.cbars i{display:block;height:6px;background:#2a2d35;margin-top:4px}.cbars i b{display:block;height:100%;background:var(--red)}
.region-hero{position:relative;min-height:220px;background-size:cover;background-position:center;border:1px solid #3a3e48;display:flex;align-items:flex-end;padding:20px}
.region-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,10,19,.1),rgba(1,10,19,.9))}
.region-hero>*{position:relative}
.ctag{display:inline-block;font:700 .74rem var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px solid #3a3e48;color:var(--amber);padding:2px 8px;text-decoration:none}
.fsel{background:#08090b;border:1px solid #2a2d35;padding:9px 12px;min-height:40px;color:#fff}
input[type=search].fsel{min-width:200px;flex:1 1 200px}

/* ---- Fiche carte ---- */
.cmodal{position:fixed;inset:0;z-index:70;background:rgba(1,6,12,.9);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.cmodal-in{background:#15171c;border-top:3px solid var(--red);padding:20px;max-width:820px;width:100%;display:flex;gap:22px;flex-wrap:wrap;position:relative;margin:auto}
.cmodal-in>.info{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px}
.cmodal .x{position:absolute;top:8px;right:8px;width:44px;height:44px;background:none;border:1px solid #3a3e48;color:#fff;cursor:pointer;font-size:1.2rem}
.ctable{width:100%;border-collapse:collapse}.ctable th,.ctable td{padding:8px;border-bottom:1px solid #2a2d35;text-align:left}.ctable th{font:700 .74rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.ctable a{color:#fff;text-decoration:none;font-weight:700}.ctable a:hover{color:var(--amber)}
.ctoast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:#1d2027;border-left:4px solid var(--amber);padding:12px 16px;max-width:90vw;font-weight:600}
.ctoast.err{border-left-color:var(--red)}
.vit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:700px){.vit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vit .slot{aspect-ratio:5/7;border:2px dashed #2a2d35;border-radius:10px;display:grid;place-items:center;color:#6f7480;font-size:.85rem;text-align:center;padding:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.facts div{background:#08090b;padding:10px;display:flex;flex-direction:column;gap:2px}.facts b{font:400 1.4rem var(--display,"Anton"),sans-serif;color:#fff}.facts span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.ocard,.ocard .in,.pack .pk-top,.pack .pk-body,.tc{transition:none}.pack.idle,.ocard.tease,.tc.holo::before,.pack .pk-shine{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="phead">
    <span class="eyebrow">Jeux · Collection</span>
    <h1>Cartes de Runeterra</h1>
    <div class="purse" id="purse"><span>Connexion…</span></div>
  </header>
  <nav class="ctabs" id="ctabs" aria-label="Sections des cartes"></nav>
  <main class="view" id="view"><div class="empty">Chargement des cartes…</div></main>
  <footer>Site de fan du Conseil des Sages, sans lien avec Riot Games. Les images et textes de League of Legends appartiennent à Riot Games. Les cartes et les Pièces d'or sont fictives : elles ne s'achètent pas avec de l'argent réel.</footer>
</div>
<script>
conseilNav("cartes");
const $=id=>document.getElementById(id),esc=conseilEsc,fmt=n=>Math.round(n).toLocaleString("fr-FR");
const A="cartes/";
// ---------- Règles (les mêmes que le robot) ----------
const RAR=["Commune","Peu commune","Rare","Épique","Légendaire"];
const RW=[55,27,12,5,1];
const RECYCLE=[2,5,15,50,150],CRAFT=RECYCLE.map(x=>x*5);
const FREE_EVERY=4*3600e3,FREE_MAX=2;
const PACKS={
  free:{n:"Booster gratuit",p:0,d:"Un booster offert toutes les 4 heures (2 en réserve au plus). 5 cartes, dont 1 Rare garantie."},
  std:{n:"Booster",p:100,d:"5 cartes de tout Runeterra, dont 1 Rare garantie."},
  region:{n:"Booster de région",p:150,d:"5 cartes d'une seule région (champions, sorts, skins et la carte de la région), dont 1 Rare garantie."},
  chest:{n:"Coffre hextech",p:400,d:"5 cartes, dont 1 Épique et 1 Rare garanties."}
};
const ROLE_FR={Fighter:"Combattant",Tank:"Tank",Mage:"Mage",Assassin:"Assassin",Marksman:"Tireur",Support:"Support"};
const SKR={kNoRarity:"Standard",kRare:"Standard",kEpic:"Épique",kLegendary:"Légendaire",kMythic:"Mythique",kUltimate:"Ultime",kTranscendent:"Transcendant",kExalted:"Exalté"};

// ---------- Données ----------
let D=null,SK=null,PL=null,CARDS=[],BY={},CH=[],REG={};
function build(){
  CH=Object.entries(D.champions).map(([id,c])=>({id,...c})).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  REG={...D.regions,unaffiliated:{name:"Runeterra (sans région)",desc:"Champions venus d'ailleurs ou trop libres pour appartenir à une seule région.",img:null}};
  PL.cards.forEach(([id,r,g],i)=>{const [t,ch,x]=id.split(":"),c={id,r,g,no:i+1};

async function api(body){

let stage=null;

async function openFlow(kind){
  if(busy||!db)return;busy=true;sndLoad();
  const label=kind==="region"?"Région · "+D.regions[regSel].name:PACKS[kind].n;
  const cover=CH[Math.floor(Math.random()*CH.length)].id;
  stage=document.createElement("div");stage.className="stage";stage.setAttribute("role","dialog");stage.setAttribute("aria-label","Ouverture du booster");
  stage.innerHTML=`<div class="tools"><button type="button" id="stMute" aria-pressed="${muted}">${muted?"Son coupé":"Son"}</button><button type="button" id="stSkip">Tout révéler</button></div>
    <div class="arena" id="arena">${packHTML(kind,{id:"opack",ch:cover,label})}</div>
    <div class="hint" id="stHint">Le robot prépare ton booster…</div><div class="strip" id="strip"></div>`;
  document.body.appendChild(stage);document.body.style.overflow="hidden";
  $("stMute").onclick=e=>{muted=!muted;try{localStorage.setItem("cartes-mute",muted?"1":"0")}catch(x){}e.target.textContent=muted?"Son coupé":"Son";e.target.setAttribute("aria-pressed",muted)};
  $("stSkip").disabled=true;

  if(res.delta)snd("coin",.8);
  const cards=(res.pack||[]).filter(p=>BY[p.id]);
  const pk=$("opack");pk.classList.add("idle");
  $("stHint").textContent="Glisse le long du haut du booster pour le déchirer (ou touche-le)";
  tearable(pk,()=>reveal(cards,res));
}
function tearable(pk,done){
  const top=pk.querySelector(".pk-top");let x0=null,w=pk.offsetWidth,fin=false;
  const set=v=>pk.style.setProperty("--tear",Math.max(0,Math.min(1,v)));
  const finish=()=>{if(fin)return;fin=true;set(1);snd("tear");setTimeout(()=>snd("out",.9),450);pk.classList.remove("idle");pk.classList.add("torn");setTimeout(done,500)};
  top.onpointerdown=e=>{x0=e.clientX;top.setPointerCapture(e.pointerId)};
  top.onpointermove=e=>{if(x0==null)return;const p=Math.abs(e.clientX-x0)/w;set(p);if(p>.7)finish()};
  top.onpointerup=e=>{if(x0!=null&&Math.abs(e.clientX-x0)<8){let p=0;const it=setInterval(()=>{p+=.12;set(p);if(p>=1){clearInterval(it);finish()}},30)}else if(!fin)set(0);x0=null};
  pk.onclick=e=>{if(e.target.closest(".pk-top"))return;let p=0;const it=setInterval(()=>{p+=.12;set(p);if(p>=1){clearInterval(it);finish()}},30)};
  pk.tabIndex=0;pk.setAttribute("role","button");pk.setAttribute("aria-label","Déchirer le booster");pk.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();finish()}};pk.focus();
}
function reveal(cards,res){
  const arena=$("arena"),pk=$("opack");pk.classList.add("drop");
  // les cartes sortent du booster, la plus rare en dernier
  const els=cards.map((p,i)=>{const c=BY[p.id],b=document.createElement("button");b.type="button";b.className="ocard hidden";b.style.setProperty("--rc",`var(--r${c.r})`);b.style.zIndex=50-i;
    b.innerHTML=`<span class="in"><span class="face back"><span class="cback"><i></i><em>CDS.TV</em></span></span><span class="face front">${cardHTML(c,{div:true,glow:c.r>=3,isNew:p.isNew,sz:118})}</span></span>`;
    b.setAttribute("aria-label",`Carte ${i+1} sur ${cards.length}, à retourner`);arena.appendChild(b);return b});
  let cur=0,flipped=false;
  setTimeout(()=>{els.forEach((b,i)=>setTimeout(()=>b.classList.remove("hidden"),i*70));setTimeout(prep,els.length*70+250)},250);
  function prep(){$("stSkip").disabled=false;if(cur>=els.length)return recap(cards,res);const b=els[cur],r=cards[cur].r;
    if(r>=2)b.classList.add("tease");$("stHint").textContent=r>=3?"Quelque chose brille…":`Touche la carte pour la retourner (${cur+1}/${els.length})`;b.focus({preventScroll:true});
    els.forEach((x,i)=>x.onclick=i===cur?step:null)}
  function step(){const b=els[cur],p=cards[cur],c=BY[p.id];
    if(!flipped){flipped=true;b.classList.remove("tease");b.classList.add("on");snd("flip");if(c.r>=4)setTimeout(()=>snd("legend"),250);if(c.r>=3)setTimeout(()=>burst(c.r),260);
      $("stHint").textContent=`${p.isNew?"Nouvelle ! ":"Doublon · "}${c.name} · ${RAR[c.r]}`;return}
    flipped=false;b.classList.add("gone");snd("place",.7);
    const s=document.createElement("span");s.className="s";s.style.setProperty("--rc",`var(--r${c.r})`);s.style.backgroundImage=`url('${artOf(c)}')`;if(c.type==="skin"){s.style.backgroundSize=`${c.of*100}% 100%`;s.style.backgroundPosition=`${c.of>1?c.i/(c.of-1)*100:0}% 0`}
    s.title=c.name;$("strip").appendChild(s);cur++;setTimeout(prep,200)}
  $("stSkip").onclick=()=>recap(cards,res);
}
function burst(r){const f=document.createElement("div");f.className="flash";f.style.setProperty("--rc",`var(--r${r})`);document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  for(let i=0;i<(r>=4?36:18);i++){const s=document.createElement("span");s.className="spark";s.style.setProperty("--rc",`var(--r${r})`);s.style.left="50%";s.style.top="45%";document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=120+Math.random()*220;s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:900+Math.random()*500,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>s.remove()}}
function recap(cards,res){if(!stage)return;
  const news=cards.filter(p=>p.isNew).length,best=cards.reduce((a,p)=>Math.max(a,p.r),0);
  const bon=(res.bonuses||[]).map(b=>b.kind==="region"?`Région complète : ${esc(D.regions[b.key]?.name||b.key)} · +${b.po} PO`:`Tous les skins de ${esc(champ(b.key)?.name||b.key)} · +${b.po} PO`);
  stage.innerHTML=`<div class="recap-wrap"><span class="eyebrow">Booster ouvert</span><h2>${news} nouvelle${news>1?"s":""} carte${news>1?"s":""}</h2>
    ${bon.length?`<div class="row" style="justify-content:center">${bon.map(t=>`<span class="ctag">${t}</span>`).join("")}</div>`:""}
    <div class="recap">${cards.map(p=>cardHTML(BY[p.id],{isNew:p.isNew,glow:p.r>=3,count:1})).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="stAgain" type="button">Ouvrir un autre</button><button class="btn ghost" id="stColl" type="button">Ma collection</button><button class="btn ghost" id="stClose" type="button">Fermer</button></div></div>`;
  if(best>=3)burst(best);
  $("stClose").onclick=closeStage;$("stColl").onclick=()=>{closeStage();location.hash="collection"};

function filtersHTML(withDup){return `<div class="chips">${[["all","Tout"],["champ","Champions"],["abil","Compétences"],["skin","Skins"],["region","Régions"]].map(([k,n])=>`<button class="chip" type="button" data-ft="${k}" aria-pressed="${fType===k}">${n}</button>`).join("")}</div>
    <div class="row"><select class="fsel" id="fRar" aria-label="Rareté"><option value="all">Toutes les raretés</option>${RAR.map((r,i)=>`<option value="${i}" ${fRar==i?"selected":""}>${r}</option>`).join("")}</select>
      <select class="fsel" id="fReg" aria-label="Région"><option value="all">Toutes les régions</option>${Object.entries(REG).map(([k,r])=>`<option value="${k}" ${fReg===k?"selected":""}>${esc(r.name)}</option>`).join("")}</select>
      <select class="fsel" id="fOwn" aria-label="Afficher"><option value="all">Toutes</option><option value="own" ${fOwn==="own"?"selected":""}>Possédées</option>${withDup?`<option value="dup" ${fOwn==="dup"?"selected":""}>Doublons</option>`:""}<option value="miss" ${fOwn==="miss"?"selected":""}>Manquantes</option></select>

function bindFilters(v){v.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{fType=b.dataset.ft;render()});
  $("fRar").onchange=e=>{fRar=e.target.value;render()};$("fReg").onchange=e=>{fReg=e.target.value;render()};$("fOwn").onchange=e=>{fOwn=e.target.value;render()};
  $("fQ").oninput=e=>{fQ=e.target.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const q=$("fQ");q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)}}
function gridHTML(list,own,o={}){return list.length?`<div class="cards">${list.slice(0,240).map(c=>cardHTML(c,{count:own(c.id),miss:!(own(c.id)>0),vit:o.vit?.includes(c.id)})).join("")}</div>${list.length>240?`<p class="note">Affine la recherche pour voir les ${list.length-240} autres cartes.</p>`:""}`:`<div class="empty">Aucune carte avec ces filtres.</div>`}
function dupValue(){return me?.c?Object.entries(me.c).reduce((a,[k,n])=>a+(BY[k]&&n>1?(n-1)*RECYCLE[BY[k].r]:0),0):0}
function vColl(v){
  if(!me){v.innerHTML=`<section class="panel frame"><h2>Ta collection est vide</h2><p class="note">Ouvre tes deux boosters gratuits pour commencer.</p><a class="btn" href="#boosters" style="align-self:flex-start">Ouvrir un booster</a></section>`;return}

  v.innerHTML=`<section class="panel frame"><div class="between"><h2>Ma collection</h2><span class="note">${owned()} / ${total()} cartes · ${me.opened||0} boosters ouverts</span></div>
    <div class="facts">${RAR.map((r,i)=>`<div><b style="color:var(--r${i})">${t[i]||0}</b><span>${r}s · ${CARDS.filter(c=>c.r===i).length}</span></div>`).join("")}</div>
    ${filtersHTML(true)}
    <div class="row"><button class="btn small" id="recycle" type="button" ${dup&&hasWallet?"":"disabled"}>${!hasWallet?"Coffre PO fermé : pas de recyclage":dup?`Recycler tous les doublons (+${fmt(dup)} PO)`:"Aucun doublon à recycler"}</button><span class="note">${list.length} carte${list.length>1?"s":""} · touche une carte pour la voir, la créer ou la mettre en vitrine</span></div></section>
    ${gridHTML(list,mine,{vit:me.vitrine||[]})}`;
  bindFilters(v);

    try{const r=await api({op:"recycle"});snd("coin");toast(`+${fmt(r.delta)} PO : doublons recyclés`)}catch(err){toast(err.message,true);render()}};

  const inVit=(me?.vitrine||[]).includes(id),canCraft=db&&hasWallet&&!n&&(po||0)>=CRAFT[c.r];
  const owners=Object.entries(all).filter(([u,d])=>u!==uid&&d.c?.[id]>0&&!conseilIsClaimed(u)).map(([u,d])=>`<a class="ctag" href="#sage-${encodeURIComponent(u)}" style="color:#fff">${esc(d.pseudo||"Un sage")}${d.c[id]>1?" ×"+d.c[id]:""}</a>`);
  m.innerHTML=`<div class="cmodal-in"><button class="x" type="button" aria-label="Fermer">✕</button>${cardHTML(c,{big:true,count:n,glow:c.r>=3})}
    <div class="info"><span class="rar" style="--rc:var(--r${c.r})">◆ ${RAR[c.r]} · carte #${c.no}</span>${info}
    <p class="note" style="margin:0">${n?`Tu possèdes ${n} exemplaire${n>1?"s":""}.`:"Tu ne possèdes pas encore cette carte."}</p>
    <div class="row">
      ${!n&&db?`<button class="btn small" id="craft" type="button" ${canCraft?"":"disabled"}>${!hasWallet?"Coffre PO fermé":(po||0)<CRAFT[c.r]?`Créer : il manque ${fmt(CRAFT[c.r]-(po||0))} PO`:`Créer pour ${fmt(CRAFT[c.r])} PO`}</button>`:""}

      ${n>1&&hasWallet?`<button class="btn small ghost" id="rec1" type="button">Recycler ${n-1} doublon${n>2?"s":""} (+${fmt((n-1)*RECYCLE[c.r])} PO)</button>`:""}

  const cr=m.querySelector("#craft");if(cr)cr.onclick=async()=>{if(!cr.dataset.sure){cr.dataset.sure=1;cr.textContent=`Confirmer : ${fmt(CRAFT[c.r])} PO`;return}cr.disabled=true;cr.textContent="Création…";

    try{await db.collection("cards").doc(uid).update({vitrine:v2});close();toast(inVit?"Retirée de ta vitrine":"Ajoutée à ta vitrine")}catch(e){toast("Vitrine indisponible pour le moment.",true)}};
  const rb=m.querySelector("#rec1");if(rb)rb.onclick=async()=>{rb.disabled=true;try{const r=await api({op:"recycle",ids:[id]});snd("coin");close();toast(`+${fmt(r.delta)} PO`)}catch(e){toast(e.message,true);rb.disabled=false}};
  m.querySelector(".x").focus();
}

(async()=>{
  try{[D,SK,PL]=await Promise.all(["data.json","skins.json","pool.json"].map(f=>fetch(A+f).then(r=>{if(!r.ok)throw 0;return r.json()})))}
  catch(e){$("view").innerHTML=`<div class="empty">Impossible de charger les cartes. Recharge la page.</div>`;return}
  const fix=t=>String(t||"").replace(/([.!?…])([A-ZÀ-Ý«])/g,"$1 $2");
  for(const r of Object.values(D.regions))r.desc=fix(r.desc);for(const c of Object.values(D.champions)){c.lore=fix(c.lore);c.blurb=fix(c.blurb)}
  build();
  const c=await conseilConnect();if(c.uid===CONSEIL_ADMIN)route();if(!c.db){$("purse").innerHTML=`<span>Site injoignable pour le moment, recharge la page.</span>`;return}
  db=c.db;uid=c.uid;
  if(uid!==CONSEIL_ADMIN){$("ctabs").hidden=true;$("purse").innerHTML="";$("view").innerHTML=`<section class="panel frame"><h2>Bientôt sur CDS.TV</h2><p class="note" style="margin:0">Les cartes de Runeterra sont en préparation. Reviens très vite !</p></section>`;D=null;return}
  const soft=()=>{if(stage||document.querySelector(".cmodal"))renderPurse();else if(view==="boosters"||view==="sages"||view==="sage"||view==="collection")render();else renderPurse()};
  db.collection("cards").onSnapshot(q=>{all={};q.docs.forEach(d=>all[d.id]=d.data());me=all[uid]||null;if(document.activeElement?.id==="fQ"||document.activeElement?.id==="wQ")renderPurse();else soft()},e=>console.error(e));
  db.collection("wallets").doc(uid).onSnapshot(s=>{hasWallet=s.exists;po=s.exists?(s.data().po||0):0;soft()},()=>{});
  db.collection("cardFeed").orderBy("at","desc").limit(15).onSnapshot(q=>{feed=q.docs.map(d=>d.data());const f=$("feed");if(f)f.innerHTML=feedHTML()},()=>{});
  render();
  window.addEventListener("conseil-camps",()=>{if(view==="sages")render()});
})();
</script>
