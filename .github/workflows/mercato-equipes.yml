name: "Mercato : équipes et joueurs officiels"
# Récupère sur LoL Esports les équipes LEC, LCK et LPL (logo, joueurs, postes, photos) pour la page Mercato.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/mercato-equipes.yml"]
permissions:
  contents: write
jobs:
  equipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS --fail -H "x-api-key: 0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z" "https://esports-api.lolesports.com/persisted/gw/getTeams?hl=fr-FR" -o teams.json
          mkdir -p img/equipes
          jq '[.data.teams[] | select(.homeLeague.name=="LEC" or .homeLeague.name=="LCK" or .homeLeague.name=="LPL") | select(.status=="active") | {slug,name,code,league:.homeLeague.name,image,players:[.players[]|{n:.summonerName,first:.firstName,last:.lastName,role,image}]}]' teams.json > img/equipes/equipes.json
          jq -r '.[] | [.slug,.image] | @tsv' img/equipes/equipes.json | while IFS=$'\t' read -r slug url; do
            url=$(echo "$url" | sed 's#^http://#https://#')
            curl -sS --fail -L "$url" -o "img/equipes/$slug.png" || echo "échec $slug"
          done
          rm teams.json
          jq -r '.[] | "\(.league) \(.name) (\(.players|length))"' img/equipes/equipes.json
      - run: |
          git config user.name "cds-bot"
          git config user.email "cds-bot@users.noreply.github.com"
          git add img/equipes
          git commit -m "Mercato : équipes et joueurs officiels" || echo "rien de nouveau"
          git push
