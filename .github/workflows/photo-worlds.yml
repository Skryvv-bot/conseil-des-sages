name: "Photo des champions du monde"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/photo-worlds.yml"]
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img/worlds
          g(){ curl -sS -L -m 30 -A "Mozilla/5.0" "$2" -o "img/worlds/$1" && file "img/worlds/$1" || echo "échec $1"; }
          g c1.jpg "https://gaming-cdn.com/images/news/articles/23038/cover/blg-remporte-les-worlds-2026-de-league-of-legends-cover6af8f9448f781.jpg"
          g c2.jpg "https://geekslands.fr/api/og-image/api/uploads/content/karmine-corp-worlds-2026-blg-viper.jpg"
          g c3.jpg "https://img.youtube.com/vi/fFlOTEiQ9x0/maxresdefault.jpg"
          for u in "https://spiritgamer.fr/worlds-2026-finale-blg-champion-gen-g/" "https://dotesports.com/league-of-legends/news/blg-win-worlds-championship-2026" "https://lolesports.com/"; do
            echo "== $u"; curl -sS -L -m 30 -A "Mozilla/5.0" "$u" | grep -oE '(og:image|twitter:image)[^>]*content="[^"]+"' | head -3 || true; done
          i=4; for u in "https://spiritgamer.fr/worlds-2026-finale-blg-champion-gen-g/" "https://dotesports.com/league-of-legends/news/blg-win-worlds-championship-2026"; do
            im=$(curl -sS -L -m 30 -A "Mozilla/5.0" "$u" | grep -oE 'og:image"[^>]*content="[^"]+"' | head -1 | grep -oE 'https?://[^"]+' || true)
            [ -n "$im" ] && g "c$i.jpg" "$im"; i=$((i+1)); done
      - run: |
          git config user.name "cds-bot"
          git config user.email "cds-bot@users.noreply.github.com"
          git add img/worlds
          git commit -m "Photos candidates : champions du monde" || echo "rien"
          git push
