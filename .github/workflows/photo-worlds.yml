name: "Photo des champions du monde"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/photo-worlds.yml"]
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img/worlds
          g(){ curl -sS -L -m 30 -A "Mozilla/5.0" "$2" -o "img/worlds/$1" && file "img/worlds/$1" || echo "échec $1"; }
          i=5; for u in "https://www.gosugamers.net/lol/news/79501-bilibili-gaming-defeat-gen-g-to-be-crowned-worlds-2026-champions" "https://lolnow.gg/worlds-2026-final-blg-beat-gen-g/" "https://news.cgtn.com/news/2026-11-15/China-s-BLG-beats-ROK-s-Gen-G-3-1-to-win-League-of-Legends-world-title-1S5lLVPDUSQ/p.html" "https://www.chinadaily.com.cn/a/202611/15/WS6af992a5e4b03ebf8519c727.html" "https://sports.khan.co.kr/en/article/202611151233007"; do
            html=$(curl -sS -L -m 30 -A "Mozilla/5.0" "$u" || true)
            im=$(echo "$html" | grep -oE '(property|name)="(og:image|twitter:image)"[^>]*content="[^"]+"' | head -1 | grep -oE 'content="[^"]+"' | sed 's/content="//;s/"$//' || true)
            [ -z "$im" ] && im=$(echo "$html" | grep -oE 'content="[^"]+"[^>]*(property|name)="og:image"' | head -1 | grep -oE 'content="[^"]+"' | sed 's/content="//;s/"$//' || true)
            echo "== $u -> $im"; case "$im" in //*) im="https:$im";; esac
            [ -n "$im" ] && g "c$i.jpg" "$im"; i=$((i+1)); done
      - run: |
          git config user.name "cds-bot"
          git config user.email "cds-bot@users.noreply.github.com"
          git add img/worlds
          git commit -m "Photos candidates : champions du monde" || echo "rien"
          git push
