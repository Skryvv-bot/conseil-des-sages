name: Déployer l'Arène de la Faille
on:
  push:
    branches: [main]
    paths: ["arene-serveur/**", ".github/workflows/arene.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARENA_KEY: ${{ secrets.ARENA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets and variables > Actions"; exit 1; fi
      - name: Déployer le worker cds-arene
        working-directory: arene-serveur
        run: npx --yes wrangler@3.114.17 deploy
      - name: Clé partagée avec le robot (PO)
        if: env.ARENA_KEY != ''
        working-directory: arene-serveur
        run: echo "$ARENA_KEY" | npx --yes wrangler@3.114.17 secret put ARENA_KEY
